name: App checks
on:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check public/app.js
      - run: node --check public/behta-enhancements.js
      - run: node --check public/field-upgrades.js
      - run: node --check public/confidence-persistence.js
      - run: node --check public/pwa.js
      - run: node --check public/bng.js
      - run: node --check public/rapid-protocols.js
      - run: node --check public/multi-survey.js
      - run: node --check public/species-id.js
      - run: node --check public/sw.js
      - run: node -e "JSON.parse(require('fs').readFileSync('public/manifest.webmanifest','utf8')); console.log('manifest ok')"
