<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Field Surveys botanical app icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173f2d"/>
      <stop offset="1" stop-color="#2d6a48"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0b2418" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <circle cx="244" cy="228" r="144" fill="#f7f4e8" filter="url(#shadow)"/>
  <circle cx="244" cy="228" r="121" fill="#eef5ef" stroke="#173f2d" stroke-width="18"/>

  <!-- grass blades inside the lens -->
  <path d="M197 321C200 252 214 187 246 126" fill="none" stroke="#3d8659" stroke-width="18" stroke-linecap="round"/>
  <path d="M247 321C250 257 267 205 306 153" fill="none" stroke="#6aa472" stroke-width="15" stroke-linecap="round"/>
  <path d="M167 303C175 258 185 222 210 184" fill="none" stroke="#83ae78" stroke-width="13" stroke-linecap="round"/>
  <path d="M210 223c-34-8-57-24-72-48 38-3 67 7 89 30" fill="#8fbd7f" stroke="#3d754f" stroke-width="5" stroke-linejoin="round"/>
  <path d="M265 226c36-5 65-18 88-42-42-4-73 7-96 30" fill="#9cc886" stroke="#3d754f" stroke-width="5" stroke-linejoin="round"/>

  <!-- simple five-petalled field flower -->
  <g transform="translate(244 190)">
    <ellipse cx="0" cy="-34" rx="22" ry="34" fill="#f0c85a" stroke="#b58b1c" stroke-width="5"/>
    <ellipse cx="32" cy="-10" rx="22" ry="34" transform="rotate(72 32 -10)" fill="#f0c85a" stroke="#b58b1c" stroke-width="5"/>
    <ellipse cx="20" cy="28" rx="22" ry="34" transform="rotate(144 20 28)" fill="#f0c85a" stroke="#b58b1c" stroke-width="5"/>
    <ellipse cx="-20" cy="28" rx="22" ry="34" transform="rotate(216 -20 28)" fill="#f0c85a" stroke="#b58b1c" stroke-width="5"/>
    <ellipse cx="-32" cy="-10" rx="22" ry="34" transform="rotate(288 -32 -10)" fill="#f0c85a" stroke="#b58b1c" stroke-width="5"/>
    <circle r="22" fill="#704f27"/>
  </g>

  <!-- magnifying-glass rim and handle -->
  <circle cx="244" cy="228" r="144" fill="none" stroke="#f7f4e8" stroke-width="24"/>
  <path d="M347 331L430 414" fill="none" stroke="#f7f4e8" stroke-width="38" stroke-linecap="round"/>
  <path d="M352 336L424 408" fill="none" stroke="#173f2d" stroke-width="18" stroke-linecap="round"/>
</svg>
