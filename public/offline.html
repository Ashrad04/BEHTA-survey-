<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#214d35">
  <title>BEHTA Recorder · Offline</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17302b;background:#eef3ef}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px}.card{width:min(460px,100%);background:#fff;border:1px solid #dce6df;border-radius:22px;padding:26px;box-shadow:0 18px 55px rgba(28,68,47,.12)}.mark{width:58px;height:58px;border-radius:17px;background:#214d35;color:#fff;display:grid;place-items:center;font-size:28px;margin-bottom:16px}.eyebrow{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:#688073}.card h1{margin:5px 0 8px;font-size:26px}.card p{color:#617269;line-height:1.55;margin:0 0 14px}.note{background:#f5f8f5;border:1px solid #e2e9e4;border-radius:12px;padding:11px 12px;font-size:13px}.card button{margin-top:16px;width:100%;border:0;border-radius:12px;padding:12px 14px;background:#214d35;color:#fff;font-weight:850}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">⌁</div>
    <div class="eyebrow">BEHTA Field Recorder</div>
    <h1>You’re offline</h1>
    <p>The installed app shell is available without signal. Any working field draft already saved on this device can be resumed when the main app opens.</p>
    <div class="note">Reconnect before sending a survey to the server or exporting shared records.</div>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
